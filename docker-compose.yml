services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '80:80'
      - '443:443'
    environment:
      - TRAEFIK_DASHBOARD_AUTH=${TRAEFIK_DASHBOARD_AUTH:-}
    command:
      # API and Dashboard
      - '--api.dashboard=true'
      # Providers
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=traefik-public'
      # Entrypoints
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      # HTTP to HTTPS redirect
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.web.http.redirections.entrypoint.permanent=true'
      # Let's Encrypt
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      # Logging
      - '--log.level=INFO'
      - '--accesslog=true'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './traefik/acme.json:/letsencrypt/acme.json'
    networks:
      - traefik-public
    labels:
      # Enable Traefik for this service
      - 'traefik.enable=true'
      # Dashboard router
      - 'traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)'
      - 'traefik.http.routers.traefik-dashboard.entrypoints=websecure'
      - 'traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.traefik-dashboard.service=api@internal'
      - 'traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth,security-headers'
      # Dashboard authentication
      - 'traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}'
      # Security headers middleware
      - 'traefik.http.middlewares.security-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.security-headers.headers.stsPreload=true'
      - 'traefik.http.middlewares.security-headers.headers.forceSTSHeader=true'
      - 'traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.security-headers.headers.browserXssFilter=true'
      - 'traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin'
      - 'traefik.http.middlewares.security-headers.headers.frameDeny=true'
      # Rate limiting middleware
      - 'traefik.http.middlewares.rate-limit.ratelimit.average=100'
      - 'traefik.http.middlewares.rate-limit.ratelimit.burst=50'
      - 'traefik.http.middlewares.rate-limit.ratelimit.period=1s'

  savvisound-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savvisound-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    expose:
      - '5005'
    networks:
      - traefik-public
      - backend
    depends_on:
      - traefik
    labels:
      # Enable Traefik for this service
      - 'traefik.enable=true'
      # Router configuration
      - 'traefik.http.routers.savvisound-api.rule=Host(`api.${DOMAIN}`)'
      - 'traefik.http.routers.savvisound-api.entrypoints=websecure'
      - 'traefik.http.routers.savvisound-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.savvisound-api.middlewares=security-headers,rate-limit'
      # Service configuration
      - 'traefik.http.services.savvisound-api.loadbalancer.server.port=5005'
      - 'traefik.http.services.savvisound-api.loadbalancer.healthcheck.path=/health'
      - 'traefik.http.services.savvisound-api.loadbalancer.healthcheck.interval=30s'
      - 'traefik.http.services.savvisound-api.loadbalancer.healthcheck.timeout=10s'
      # Network
      - 'traefik.docker.network=traefik-public'

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
  backend:
    name: backend
    driver: bridge
